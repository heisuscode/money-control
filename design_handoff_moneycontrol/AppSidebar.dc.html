<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<aside style="width:{{ width }};flex-shrink:0;background:{{ bg }};border-right:1px solid {{ border }};display:flex;flex-direction:column;padding:22px 14px;height:100%;box-sizing:border-box;transition:width .18s ease;overflow:hidden;">
  <div style="display:flex;flex-wrap:wrap;align-items:center;gap:10px;justify-content:center;padding:0 4px 16px;">
    <div style="width:32px;height:32px;border-radius:9px;background:linear-gradient(150deg,#2F6BD4,#033B85);display:flex;align-items:center;justify-content:center;flex-shrink:0;"><svg viewBox="0 0 48 48" width="20" height="20" fill="none"><rect x="6" y="37" width="36" height="5.6" rx="2.8" fill="#fff"></rect><rect x="11" y="29" width="7.6" height="9" rx="2" fill="#fff"></rect><rect x="20.2" y="23" width="7.6" height="15" rx="2" fill="#fff"></rect><rect x="29.4" y="18" width="7.6" height="20" rx="2" fill="#fff"></rect><path d="M9.5 25.5 L18 17.5 L24 21.5 L34.5 10.8" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"></path><path d="M28 10.8 H34.7 V17.3" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"></path></svg></div>
    <span style="flex:1;min-width:0;font-size:16px;font-weight:800;letter-spacing:-.02em;white-space:nowrap;color:{{ brand }};display:{{ nameDisplay }};">MoneyControl</span>
    <button onClick="{{ toggle }}" title="Recolher menu" style="width:30px;height:30px;border-radius:9px;border:1px solid {{ border }};background:transparent;display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;padding:0;">{{ toggleIcon }}</button>
  </div>
  <div style="font-size:10px;font-weight:700;letter-spacing:.1em;color:{{ section }};padding:8px 10px 6px;display:{{ sectionDisplay }};">PRINCIPAL</div>
  <nav style="display:flex;flex-direction:column;gap:3px;">{{ principalEls }}</nav>
  <div style="font-size:10px;font-weight:700;letter-spacing:.1em;color:{{ section }};padding:18px 10px 6px;display:{{ sectionDisplay }};">CONTA</div>
  <nav style="display:flex;flex-direction:column;gap:3px;">{{ contaEls }}</nav>
  <div style="margin-top:auto;display:flex;align-items:center;gap:10px;padding:10px;border-radius:13px;background:{{ uBg }};border:1px solid {{ uBorder }};justify-content:center;">
    <span style="width:36px;height:36px;border-radius:50%;background:linear-gradient(135deg,#6F9AE8,#004AAD);color:#fff;font-size:13px;font-weight:800;display:flex;align-items:center;justify-content:center;flex-shrink:0;">HC</span>
    <div style="line-height:1.25;overflow:hidden;display:{{ userTextDisplay }};"><div style="font-size:13px;font-weight:700;white-space:nowrap;color:{{ brand }};">Heitor C.</div><div style="font-size:11px;color:{{ uSub }};white-space:nowrap;">Plano grátis</div></div>
  </div>
</aside>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:236,&quot;height&quot;:640},&quot;active&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;dashboard&quot;,&quot;receitas&quot;,&quot;despesas&quot;,&quot;contas&quot;,&quot;metas&quot;,&quot;relatorios&quot;,&quot;calendario&quot;,&quot;cambio&quot;,&quot;notificacoes&quot;,&quot;config&quot;],&quot;default&quot;:&quot;dashboard&quot;},&quot;theme&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;light&quot;,&quot;dark&quot;],&quot;default&quot;:&quot;light&quot;}}">
class Component extends DCLogic {
  state = { collapsed: false };
  renderVals() {
    const dark = this.props.theme === 'dark';
    const active = this.props.active || 'dashboard';
    const collapsed = !!this.state.collapsed;
    const C = dark
      ? { bg:'#0E1726', border:'#1C2740', section:'#5B6B85', nav:'#93A1B7', aBg:'rgba(79,132,255,.16)', aText:'#7FA8FF', brand:'#EAF1FB', uBg:'#141D2E', uBorder:'#1C2740', uSub:'#6B7C96', chev:'#6B7C96', novoBg:'rgba(79,132,255,.2)', novoText:'#9DB8FF' }
      : { bg:'#fff', border:'#EEF1F6', section:'#A6B0BF', nav:'#56627A', aBg:'#EAF1FE', aText:'#033B85', brand:'#0E1726', uBg:'#F6F8FB', uBorder:'#EEF1F6', uSub:'#8A95A6', chev:'#94A3B8', novoBg:'#DCE8FF', novoText:'#1D4ED8' };
    const I = {
      dashboard:'<rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/>',
      receitas:'<path d="M12 19V5"/><path d="M6 11l6-6 6 6"/>',
      despesas:'<path d="M12 5v14"/><path d="M6 13l6 6 6-6"/>',
      contas:'<path d="M5 3h14v18l-3-2-2 2-2-2-2 2-2-2-3 2z"/><path d="M9 8h6M9 12h6"/>',
      metas:'<circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="3.5"/>',
      relatorios:'<path d="M4 20V10M10 20V4M16 20v-8M22 20H2"/>',
      calendario:'<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 9h18M8 3v4M16 3v4"/>',
      cambio:'<path d="M4 8h13l-3-3M20 16H7l3 3"/>',
      notificacoes:'<path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/>',
      config:'<line x1="4" y1="8" x2="20" y2="8"/><circle cx="9" cy="8" r="2.4"/><line x1="4" y1="16" x2="20" y2="16"/><circle cx="15" cy="16" r="2.4"/>'
    };
    const icon = (key, color) => React.createElement('svg', { width:18, height:18, viewBox:'0 0 24 24', fill:'none', stroke:color, strokeWidth:2, strokeLinecap:'round', strokeLinejoin:'round', style:{flexShrink:0,display:'block'}, dangerouslySetInnerHTML:{__html:I[key]} });
    const row = (it) => {
      const on = it.key === active;
      const color = on ? C.aText : C.nav;
      const kids = [ icon(it.key, color) ];
      if (!collapsed) {
        kids.push(React.createElement('span', { key:'l', style:{whiteSpace:'nowrap'} }, it.label));
        if (it.badge) kids.push(React.createElement('span', { key:'b', style: Object.assign({ marginLeft:'auto' }, it.badgeStyle) }, it.badge));
      }
      const dot = on ? React.createElement('span', { key:'d', style:{ position:'absolute', left:collapsed?'8px':'2px', top:'50%', transform:'translateY(-50%)', width:'3px', height:'18px', borderRadius:'99px', background:C.aText } }) : null;
      return React.createElement('div', { key:it.key, title: collapsed ? it.label : undefined, style:{ position:'relative', display:'flex', alignItems:'center', gap:'11px', padding:'11px', borderRadius:'11px', background:on?C.aBg:'transparent', color, fontSize:'14px', fontWeight:on?700:600, cursor:'pointer', justifyContent: collapsed?'center':'flex-start' } }, dot, ...kids);
    };
    const novoBadge = { fontSize:'9px', fontWeight:800, color:C.novoText, background:C.novoBg, padding:'3px 6px', borderRadius:'6px' };
    const countBadge = { width:'18px', height:'18px', borderRadius:'50%', background:'#E5484D', color:'#fff', fontSize:'10px', fontWeight:800, display:'flex', alignItems:'center', justifyContent:'center' };
    const principal = [
      {key:'dashboard',label:'Dashboard'},
      {key:'receitas',label:'Receitas'},
      {key:'despesas',label:'Despesas'},
      {key:'contas',label:'Contas a pagar'},
      {key:'metas',label:'Metas'},
      {key:'relatorios',label:'Relatórios'},
      {key:'calendario',label:'Calendário'},
      {key:'cambio',label:'Câmbio', badge:'NOVO', badgeStyle:novoBadge},
    ];
    const conta = [
      {key:'notificacoes',label:'Notificações', badge:'3', badgeStyle:countBadge},
      {key:'config',label:'Configurações'},
    ];
    const chev = (d) => React.createElement('svg', { width:16, height:16, viewBox:'0 0 24 24', fill:'none', stroke:C.chev, strokeWidth:2, strokeLinecap:'round', strokeLinejoin:'round', dangerouslySetInnerHTML:{__html:d} });
    return {
      width: collapsed ? '76px' : '236px',
      bg:C.bg, border:C.border, section:C.section, brand:C.brand,
      uBg:C.uBg, uBorder:C.uBorder, uSub:C.uSub,
      nameDisplay: collapsed ? 'none' : 'block',
      sectionDisplay: collapsed ? 'none' : 'block',
      userTextDisplay: collapsed ? 'none' : 'block',
      principalEls: principal.map(row),
      contaEls: conta.map(row),
      toggle: () => this.setState(s => ({ collapsed: !s.collapsed })),
      toggleIcon: collapsed ? chev('<path d="M9 6l6 6-6 6"/>') : chev('<path d="M15 6l-6 6 6 6"/>'),
    };
  }
}
</script>
</body>
</html>
